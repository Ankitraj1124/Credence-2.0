spring.application.name=CREDENCE-2.0
spring.datasource.url=jdbc:mysql://localhost:3306/credence_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Groq Configuration (free tier, OpenAI-compatible API)
# Get a free key from https://console.groq.com/keys
# Set GROQ_API_KEY as an environment variable - never paste the real key here
groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.3-70b-versatile

# JWT Configuration
# jwt.secret MUST be a Base64-encoded string that is at least 256 bits (32 bytes) once decoded.
# Set JWT_SECRET as an environment variable - never paste the real secret here.
# Generate one locally with:  openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
